name: YouTube Download (Split & Commit)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
      quality:
        description: 'Desired quality (e.g. 720p, best, 1080p)'
        required: true
        default: '720p'
      folder_name:
        description: 'Target folder name (created by the script)'
        required: true

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp, ffmpeg, and split tool
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          pip install --upgrade yt-dlp

      - name: Connect to Cloudflare WARP (optional, helps with geo-restrictions)
        uses: viperadnan-git/setup-warp@v1
        with:
          mode: client
          stack: ipv4

      - name: Download video with selected quality
        id: download
        run: |
          mkdir -p "${{ github.event.inputs.folder_name }}"
          QUALITY="${{ github.event.inputs.quality }}"
          URL="${{ github.event.inputs.video_url }}"

          if [ "$QUALITY" = "best" ]; then
            FORMAT="bestvideo+bestaudio/best"
          else
            HEIGHT=$(echo "$QUALITY" | sed 's/p//')
            FORMAT="bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/best"
          fi

          echo "Trying format: $FORMAT with web_safari client"
          if yt-dlp -f "$FORMAT" \
               -o "${{ github.event.inputs.folder_name }}/video.%(ext)s" \
               --merge-output-format mp4 \
               --no-playlist \
               --extractor-args "youtube:player_client=web_safari;formats=missing_pot" \
               "$URL"; then
            echo "Downloaded with requested quality (web_safari)."
          elif yt-dlp -f "$FORMAT" \
               -o "${{ github.event.inputs.folder_name }}/video.%(ext)s" \
               --merge-output-format mp4 \
               --no-playlist \
               --extractor-args "youtube:player_client=ios;formats=missing_pot" \
               "$URL"; then
            echo "Downloaded with requested quality (ios client)."
          elif yt-dlp -f "$FORMAT" \
               -o "${{ github.event.inputs.folder_name }}/video.%(ext)s" \
               --merge-output-format mp4 \
               --no-playlist \
               --extractor-args "youtube:player_client=tv;formats=missing_pot" \
               "$URL"; then
            echo "Downloaded with requested quality (tv client)."
          else
            echo "Falling back to best available."
            yt-dlp -f "bestvideo+bestaudio/best" \
                   -o "${{ github.event.inputs.folder_name }}/video.%(ext)s" \
                   --merge-output-format mp4 \
                   --no-playlist \
                   --extractor-args "youtube:formats=missing_pot" \
                   "$URL" || { echo "Download completely failed."; exit 1; }
          fi

          # Rename to a clean filename (using folder name as timestamp)
          mv "${{ github.event.inputs.folder_name }}/video.mp4" "${{ github.event.inputs.folder_name }}/${{ github.event.inputs.folder_name }}.mp4"
          echo "file_path=${{ github.event.inputs.folder_name }}/${{ github.event.inputs.folder_name }}.mp4" >> $GITHUB_OUTPUT

      - name: Split file into chunks (if larger than 10 MB)
        run: |
          FILE="${{ steps.download.outputs.file_path }}"
          SIZE=$(stat -c%s "$FILE")
          THRESHOLD=$((10 * 1024 * 1024))   # 10 MB

          if [ $SIZE -gt $THRESHOLD ]; then
            echo "File is larger than 10 MB. Splitting into chunks."
            mkdir -p "${{ github.event.inputs.folder_name }}/chunks"
            # Split into 10 MB chunks, naming them chunk_001, chunk_002, ...
            split -b 10M -d "$FILE" "${{ github.event.inputs.folder_name }}/chunks/chunk_"
            # Rename split files to have .part extension (optional)
            for f in ${{ github.event.inputs.folder_name }}/chunks/chunk_*; do
              mv "$f" "${f}.part"
            done
            # Delete the original file
            rm "$FILE"
            echo "chunked=true" >> $GITHUB_OUTPUT
          else
            echo "File is small (under 10 MB). Keeping as a single file."
            echo "chunked=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit everything to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.folder_name }}"
          git commit -m "YouTube video: ${{ github.event.inputs.quality }} - ${{ github.event.inputs.folder_name }}" || echo "No changes"
          git pull --rebase origin main
          git push
