name: Download from Gofile, Split, and Commit

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: 'Gofile.io link (e.g. https://gofile.io/d/oOHHQ6)'
        required: true

jobs:
  split-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create timestamped folder name (MMDDHHMMSS)
        id: timestamp
        run: |
          TS=$(date +'%m%d%H%M%S')
          echo "folder_name=$TS" >> $GITHUB_OUTPUT
          echo "Created folder: $TS"

      - name: Install yt-dlp (supports Gofile)
        run: |
          pip install yt-dlp

      - name: Download file from Gofile using yt-dlp
        run: |
          FOLDER="${{ steps.timestamp.outputs.folder_name }}"
          mkdir -p "$FOLDER"
          yt-dlp \
            --no-playlist \
            --output "$FOLDER/downloaded_file" \
            "${{ github.event.inputs.gofile_url }}"

      - name: Check file size and either split or rename
        run: |
          FOLDER="${{ steps.timestamp.outputs.folder_name }}"
          FILE_PATH="$FOLDER/downloaded_file"
          SIZE_MB=$(du -m "$FILE_PATH" | cut -f1)

          if [ "$SIZE_MB" -lt 95 ]; then
            echo "File is ${SIZE_MB}MB (<95MB) – keeping as single file named after folder"
            mv "$FILE_PATH" "$FOLDER/$FOLDER"
          else
            echo "File is ${SIZE_MB}MB (>=95MB) – splitting into 95MB chunks"
            mkdir -p "$FOLDER/chunks"
            split -b 95M "$FILE_PATH" "$FOLDER/chunks/chunk_"
            rm "$FILE_PATH"
          fi

      - name: Commit and push the new folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.timestamp.outputs.folder_name }}"
          git commit -m "Add ${{ steps.timestamp.outputs.folder_name }} from ${{ github.event.inputs.gofile_url }}" || echo "No changes"
          git push
